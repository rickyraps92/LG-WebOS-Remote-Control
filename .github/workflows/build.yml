name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          npm install
          npm run build

      - name: Keep built file for HACS
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/lg-webos-remote-control-custom.js
          if git diff --cached --quiet; then
            echo "Built file is already current."
            exit 0
          fi
          git commit -m "Build HACS bundle"
          git push

      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: lg-webos-remote-control-custom
          path: dist/lg-webos-remote-control-custom.js
